name: Publish

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions UI / `gh workflow run` — runs the
  # install/build/test pipeline only. The publish step is gated on
  # github.event_name == 'push' so manual runs never accidentally
  # release.
  workflow_dispatch:

permissions:
  id-token: write    # required for npm OIDC trusted publishing + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm version is sourced from package.json `packageManager` —
      # do not also specify it here, the action errors on mismatch.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # No cache: release builds must not reuse a stale dep tree.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Includes the real SvelteKit fixture build under RUN_REAL_E2E=1
      # so we never publish a tag that hasn't booted a real svelte-kit
      # app end-to-end.
      - run: pnpm test
        env:
          RUN_REAL_E2E: '1'

      # Skip the publish step when this exact version is already on
      # npm — happens when the first release was cut manually with an
      # OTP before the tag was pushed. Re-running the tag stays safe.
      - name: Check if version already published
        if: github.event_name == 'push'
        id: published
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          pkg_version=$(node -p "require('./package.json').version")
          if npm view "$pkg_name@$pkg_version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg_name@$pkg_version already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # npm CLI (not pnpm publish) handles the OIDC token exchange and
      # SLSA provenance attestation. --access public is implied by
      # publishConfig in package.json but kept explicit here for clarity.
      # Skipped on workflow_dispatch so manual verifications never
      # accidentally cut a release.
      - run: npm publish --provenance --access public
        if: github.event_name == 'push' && steps.published.outputs.skip != 'true'
