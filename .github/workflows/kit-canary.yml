name: Kit canary

# Runs our test suite against the latest @sveltejs/kit, separately
# from CI's pinned version. Catches upstream churn (behavioural
# changes, new experimental features that break our entry) within
# days of release, without polluting CI on every PR.
#
# On failure, opens / updates an issue tagged kit-upstream-break so we
# notice without having to remember to check the Actions tab.

on:
  schedule:
    # 08:00 UTC every Monday — early enough that a break shows up at
    # the start of the working week, not during a Friday release rush.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-against-latest:
    runs-on: ubuntu-latest
    outputs:
      kit_version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Bump @sveltejs/kit in the fixture to latest
        id: bump
        working-directory: test/fixtures/real-sveltekit
        run: |
          pnpm add -D @sveltejs/kit@latest --ignore-workspace
          VERSION=$(node -p "require('@sveltejs/kit/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🔎 Testing against @sveltejs/kit@$VERSION"

      - run: pnpm build

      - run: pnpm test
        env:
          RUN_REAL_E2E: '1'
          REAL_E2E_REBUILD: '1'

  notify-on-failure:
    needs: test-against-latest
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Open or update kit-upstream-break issue
        uses: actions/github-script@v8
        with:
          script: |
            const kitVersion = '${{ needs.test-against-latest.outputs.kit_version }}' || 'unknown';
            const title = `kit-canary: tests failed against @sveltejs/kit@${kitVersion}`;
            const body = [
              `The weekly kit-canary workflow caught a regression.`,
              ``,
              `**Kit version under test:** \`${kitVersion}\``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Our pinned kit version in main is in \`test/fixtures/real-sveltekit/package.json\`.`,
              `This issue is auto-opened by \`.github/workflows/kit-canary.yml\`.`,
              ``,
              `Triage steps:`,
              `1. Read the failing run log to see which test(s) broke`,
              `2. Diff our pinned kit version against \`${kitVersion}\` (changelog at https://github.com/sveltejs/kit/releases)`,
              `3. Decide: adapter fix needed, or skip the broken kit version`,
            ].join('\n');

            // De-duplicate: if an open issue already exists, update it.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'kit-upstream-break',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['kit-upstream-break'],
              });
              console.log(`Opened issue #${created.data.number}`);
            }
